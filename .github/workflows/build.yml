name: Build Forge Mod
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip and fix paths
        run: |
          mkdir temp_project
          unzip -q project.zip -d temp_project
          # 自动寻找真正的源码目录并移动到根目录
          if [ -d "temp_project/mdk" ]; then
            mv temp_project/mdk/* .
          elif [ -d "temp_project/spiritpower" ]; then
            mv temp_project/spiritpower/* .
          else
            mv temp_project/* .
          fi
          rm -rf temp_project
          ls -la

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - run: chmod +x ./gradlew

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew build --no-daemon
        env:
          GRADLE_OPTS: "-Xmx3G"

      - uses: actions/upload-artifact@v4
        with:
          name: spiritpower-jar
          path: build/libs/*.jar
          if-no-files-found: error
